
amcl:
  ros__parameters:
    use_sim_time: true

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom

    default_nav_to_pose_bt_xml: /opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml

    navigators:
      - navigate_to_pose
      - navigate_through_poses

    enable_stamped_cmd_vel: true


controller_server:
  ros__parameters:
    use_sim_time: true

    controller_frequency: 20.0
    costmap_update_timeout: 0.3

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    failure_tolerance: 0.3
    publish_zero_velocity: true
    enable_stamped_cmd_vel: true

    odom_topic: /odom

    progress_checker_plugins:
      - progress_checker

    goal_checker_plugins:
      - general_goal_checker

    controller_plugins:
      - FollowPath

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.15
      movement_time_allowance: 10.0

    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.15
      stateful: true

    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController

      # Velocity limits
      desired_linear_vel: 0.18
      max_angular_accel: 2.0

      # Lookahead configuration
      lookahead_dist: 0.45
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.60
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true

      # Rotation
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.8
      rotate_to_heading_min_angle: 0.785

      # Velocity regulation
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true

      regulated_linear_scaling_min_radius: 0.90
      regulated_linear_scaling_min_speed: 0.05
      use_cost_regulated_linear_velocity_scaling: true

      # Approach behavior
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6

      # Collision checking
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true

      # Transform and path handling
      transform_tolerance: 0.2
      use_interpolation: true
      allow_reversing: false

      # Robot geometry
      min_distance_to_obstacle: 0.25


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true

      update_frequency: 10.0
      publish_frequency: 5.0

      global_frame: odom
      robot_base_frame: base_footprint

      rolling_window: true

      width: 4
      height: 4
      resolution: 0.05

      robot_radius: 0.22

      plugins:
        - obstacle_layer
        - inflation_layer

      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true

        observation_sources: scan

        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          inf_is_valid: true

          obstacle_max_range: 3.0
          raytrace_max_range: 3.5

          obstacle_min_range: 0.12
          raytrace_min_range: 0.12

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.35

      always_send_full_costmap: true


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true

      update_frequency: 2.0
      publish_frequency: 1.0

      global_frame: map
      robot_base_frame: base_footprint

      resolution: 0.05
      track_unknown_space: true

      robot_radius: 0.22

      plugins:
        - static_layer
        - obstacle_layer
        - inflation_layer

      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true

        observation_sources: scan

        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          inf_is_valid: true

          obstacle_max_range: 3.0
          raytrace_max_range: 3.5

          obstacle_min_range: 0.12
          raytrace_min_range: 0.12

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.35

      always_send_full_costmap: true


planner_server:
  ros__parameters:
    use_sim_time: true

    planner_plugins:
      - GridBased

    GridBased:
      plugin: nav2_smac_planner::SmacPlanner2D

      tolerance: 0.25
      downsample_costmap: false
      downsampling_factor: 1

      allow_unknown: true

      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0

      cost_travel_multiplier: 2.0
      use_final_approach_orientation: true


behavior_server:
  ros__parameters:
    use_sim_time: true

    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.2

    cycle_frequency: 10.0

    behavior_plugins:
      - spin
      - backup
      - drive_on_heading
      - wait

    spin:
      plugin: nav2_behaviors::Spin

    backup:
      plugin: nav2_behaviors::BackUp

    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading

    wait:
      plugin: nav2_behaviors::Wait


waypoint_follower:
  ros__parameters:
    use_sim_time: true

    loop_rate: 20
    stop_on_failure: true

    waypoint_task_executor_bt:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: false


velocity_smoother:
  ros__parameters:
    use_sim_time: true

    smoothing_frequency: 20.0
    scale_velocities: false

    feedback: OPEN_LOOP

    max_velocity:
      - 0.18
      - 0.0
      - 0.8

    min_velocity:
      - -0.18
      - 0.0
      - -0.8

    max_accel:
      - 0.5
      - 0.0
      - 1.0

    max_decel:
      - -0.5
      - 0.0
      - -1.0

    deadband_velocity:
      - 0.0
      - 0.0
      - 0.0

    velocity_timeout: 1.0

    enable_stamped_cmd_vel: true


collision_monitor:
  ros__parameters:
    use_sim_time: true

    base_frame_id: base_footprint
    odom_frame_id: odom

    cmd_vel_in_topic: cmd_vel
    cmd_vel_out_topic: cmd_vel_smoothed

    transform_tolerance: 0.2
    source_timeout: 0.5

    observation_sources:
      - scan

    scan:
      type: scan
      topic: /scan
      enabled: true

    polygons:
      - PolygonStop

    PolygonStop:
      type: polygon

      points: "[[0.25, 0.20], [0.25, -0.20], [-0.20, -0.20], [-0.20, 0.20]]"

      action_type: stop
      min_points: 4